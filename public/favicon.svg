<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Card -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 3"/>

  <!-- Sleek Geometric Monogram 'S' -->
  <path d="M78 36 H50 C41.16 36 34 43.16 34 52 C34 60.84 41.16 68 50 68 H78 C86.84 68 94 75.16 94 84 C94 92.84 86.84 100 78 100 H48" 
        fill="none" 
        stroke="url(#sGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Subtle Cyber Terminal Dot -->
  <circle cx="94" cy="36" r="4" fill="#38bdf8"/>
  <circle cx="34" cy="100" r="4" fill="#3b82f6"/>
</svg>
